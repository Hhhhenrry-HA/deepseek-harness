# Selected after dsh-base and dsh-web-app; disabling this bundle restores their defaults.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: exa
    fetchProvider: http
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true
- id: ui-settings-web-search
  name: '@deepseek-ai/dsh-client-ui-settings-web-search'
  disabled: true
- insert:
    - id: web-search-exa
      name: '@hhhhenrry-ha/dsh-exa-search'
