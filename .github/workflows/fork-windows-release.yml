name: Fork Windows release

on:
  push:
    tags: ['fork-v*']

permissions:
  contents: read

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Hhhhenrry-HA/deepseek-harness'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Prepare versioned package settings
        id: settings
        env:
          PACKAGE_FORK_REPOSITORY: ${{ github.repository }}
        run: |
          $env:PACKAGE_BUILD_VERSION = $env:GITHUB_REF_NAME.Substring('fork-v'.Length)
          node apps/desktop/scripts/prepare-fork-windows-ci.mjs
          exit $LASTEXITCODE
      - name: Verify real Electron check, download, checksum failure and installation authorization
        run: |
          pnpm run build:lib:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/test-local-updater.mjs
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Collect verified installer and checksums
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node apps/desktop/scripts/prepare-fork-release.mjs "$env:RELEASE_REPOSITORY" "$env:GITHUB_REF_NAME" release-assets
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-windows-diagnostics
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fork-windows-release
          path: release-assets
      - name: Publish downloadable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @"
          ## Windows x64 安装

          本次更新：

          - “答复交付”插件启用时，在系统指令顶部与末尾 `request_approval` 回执同步注入静默思考引导，扩充 `read_work_requirements` 就绪回执，并为原生 Gemini 与 Vertex（中转）默认关闭五项 `safetySettings` 过滤阈值。
          - 修复已交付答复的历史显示：成功的 `deliver_response` 正文由聊天视图常驻读取，关闭“答复交付”插件、刷新或重开会话后仍保持显示，不重复渲染，失败回执与未执行草稿不显示为正文。
          - 可选插件“答复交付”（在“插件 → 更多”中启用，默认关闭）：在每轮最后一条用户消息后追加执行清单并预填 `read_work_requirements`、`request_approval` 两组调用，保持 `AUTO` 工具选择与原有全部工具不变；模型通过 `deliver_response` 交付最终 Markdown 答复并结束回合，独立显示在过程折叠外且支持一键复制。
          - “答复交付”插件设置支持直接编辑、保存与恢复默认“额外工作要求”（挂载在 `read_work_requirements` 的工具 description 中）。
          - 修复 Gemini 3+（含 Gemini 4）在当前轮含无签名预填函数调用时的 `skip_thought_signature_validator` 透传，兼容原生 Gemini 与 Vertex（中转）。
          - 继续保留 Gemini 模型名一致性校验、Vertex（中转）流式工具调用与 Gemini 4 思考等级等此前修复；聊天记录与配置无需改动。

          下载下方名称以 .exe 结尾的安装程序，退出 DSH 后运行安装。无需自行编译或安装 Node.js。

          此为 Hhhhenrry-HA 维护的 fork，内置 Exa 网页搜索与密钥设置，支持自定义模型思考等级、用户消息编辑重发、最后一轮 AI 回答重新生成（含失败轮次）。Exa 密钥在“插件 → EXA 网页搜索”中设置，已有配置自动沿用，无需另装插件；安装包不内置私人密钥。客户端的“检查更新”连接本仓库 Releases，下载校验后由用户确认安装；不连接官方更新或强制更新服务。

          首次安装及尚未接入更新的旧版需要手动运行本安装程序，之后可在客户端内更新。安装程序未作代码签名，更新文件通过 HTTPS 获取并校验 SHA-512。

          沿用现有聊天和配置目录；不要先卸载旧版。SHA256SUMS.txt 用于核对下载文件。

          Source commit: $env:GITHUB_SHA
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^fork-v', ''
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --target "$env:GITHUB_SHA" --title "v$releaseVersion · 答复交付插件与 Gemini 预填签名支持" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          exit $LASTEXITCODE
