name: Fork Windows release

on:
  push:
    tags: ['fork-v*']

permissions:
  contents: read

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Hhhhenrry-HA/deepseek-harness'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Prepare versioned package settings
        id: settings
        env:
          PACKAGE_FORK_REPOSITORY: ${{ github.repository }}
        run: |
          $env:PACKAGE_BUILD_VERSION = $env:GITHUB_REF_NAME.Substring('fork-v'.Length)
          node apps/desktop/scripts/prepare-fork-windows-ci.mjs
          exit $LASTEXITCODE
      - name: Verify real Electron check, download, checksum failure and installation authorization
        run: |
          pnpm run build:lib:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/test-local-updater.mjs
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Collect verified installer and checksums
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node apps/desktop/scripts/prepare-fork-release.mjs "$env:RELEASE_REPOSITORY" "$env:GITHUB_REF_NAME" release-assets
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-windows-diagnostics
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fork-windows-release
          path: release-assets
      - name: Publish downloadable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @"
          ## Windows x64 安装

          本次更新：

          - 自定义渠道的 Gemini、DeepSeek 模型使用对应请求参数，原生工具和 JSON 工具模式均适用。
          - DeepSeek 补齐思考开关和工具调用回放需要的 reasoning_content。
          - Gemini 原生工具签名随会话保存，支持并行调用和重开会话，切换模型时不会串用签名。

          本次不包含“以模型发言结尾”的自动续跑 400 修复。

          下载下方名称以 .exe 结尾的安装程序，退出 DSH 后运行安装。无需自行编译或安装 Node.js。

          此为 Hhhhenrry-HA 维护的 fork，内置 Exa 网页搜索与密钥设置，支持自定义模型思考等级、用户消息编辑重发、最后一轮 AI 回答重新生成（含失败轮次）。Exa 密钥在“插件 → EXA 网页搜索”中设置，已有配置自动沿用，无需另装插件；安装包不内置私人密钥。客户端的“检查更新”连接本仓库 Releases，下载校验后由用户确认安装；不连接官方更新或强制更新服务。

          首次安装及尚未接入更新的旧版需要手动运行本安装程序，之后可在客户端内更新。安装程序未作代码签名，更新文件通过 HTTPS 获取并校验 SHA-512。

          沿用现有聊天和配置目录；不要先卸载旧版。SHA256SUMS.txt 用于核对下载文件。

          Source commit: $env:GITHUB_SHA
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^fork-v', ''
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --target "$env:GITHUB_SHA" --title "v$releaseVersion · Gemini / DeepSeek 渠道兼容修复" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          exit $LASTEXITCODE
