name: Fork Windows release

on:
  push:
    tags: ['fork-v*']

permissions:
  contents: read

concurrency:
  group: fork-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Hhhhenrry-HA/deepseek-harness'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Prepare versioned package settings
        id: settings
        env:
          PACKAGE_DEPLOYMENT: production
          PACKAGE_POLICY_ORIGIN: https://harness.deepseek.com
        run: |
          $env:PACKAGE_BUILD_VERSION = $env:GITHUB_REF_NAME.Substring('fork-v'.Length)
          node apps/desktop/scripts/prepare-windows-ci.mjs
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Collect verified installer and checksums
        run: |
          $installers = @(Get-ChildItem -LiteralPath apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one verified Windows installer' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination release-assets
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-windows-diagnostics
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fork-windows-release
          path: release-assets
      - name: Publish downloadable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @"
          ## Windows x64 安装

          下载下方名称以 .exe 结尾的安装程序，退出 DSH 后运行安装。无需自行编译或安装 Node.js。

          此为 Hhhhenrry-HA 维护的 fork，包含用户消息编辑并重发、最后一轮 AI 回答重新生成（含失败轮次）。不是 DeepSeek 官方签名版本；不接入官方签名自动更新通道，后续更新从本仓库 Releases 下载。

          沿用现有聊天和配置目录；不要先卸载旧版。SHA256SUMS.txt 用于核对下载文件。

          Source commit: $env:GITHUB_SHA
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --target "$env:GITHUB_SHA" --title "DSH Fork $env:GITHUB_REF_NAME · Windows x64" --notes-file release-notes.md --prerelease
          exit $LASTEXITCODE
